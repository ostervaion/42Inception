name: inception

services:
  mariadb:
    environment:
    - MYSQL_DATABASE=${MYSQL_DATABASE}
    - MYSQL_USER=${MYSQL_USER}
    - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    env_file: ./.env
    build: ./requirements/mariadb
    container_name: mariadb
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 5s
    networks:
      - db-net
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    env_file: ./.env
    depends_on:
      wordpress:
        condition: service_healthy
    expose:
      - "443"
    ports:
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "curl -kf https://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 5s
    domainname: juetxeba.42.fr
    networks:
      - wp-net
    volumes:
      - website-data:/var/www/html:ro
    restart: unless-stopped


  wordpress:
    env_file: ./.env
    environment:
    - MYSQL_HOST=mariadb
    - MYSQL_DATABASE=${MYSQL_DATABASE}
    - MYSQL_USER=${MYSQL_USER}
    - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    - WP_URL=${WP_URL}
    - WP_TITLE=${WP_TITLE}
    - WP_ADMIN_USER=${WP_ADMIN_USER}
    - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD}
    - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
    - WP_USER=${WP_USER}
    - WP_USER_EMAIL=${WP_USER_EMAIL}
    - WP_USER_PASSWORD=${WP_USER_PASSWORD}
    build: ./requirements/wordpress
    container_name: wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm82 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 5s
    networks:
      - db-net
      - wp-net
    volumes:
      - website-data:/var/www/html
    restart: unless-stopped


#secrets:
