#THE NAME OF THE SECRET AS HERE LISTED

volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/juetxeba/data/mariadb-volume
  website-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/juetxeba/data/wordpress-volume
networks:
  db-net:
    driver: bridge
    name: db-net
  
  wp-net:
    driver: bridge
    name: wp-net
